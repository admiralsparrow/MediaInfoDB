  <rect x="40" y="300" width="28" height="36" rx="6" fill="rgba(255,255,255,0.3)"/>
  <rect x="40" y="360" width="28" height="36" rx="6" fill="rgba(255,255,255,0.3)"/>
  <rect x="40" y="420" width="28" height="36" rx="6" fill="rgba(255,255,255,0.3)"/>
  <!-- Film strip perforations right -->
  <rect x="444" y="60" width="28" height="36" rx="6" fill="rgba(255,255,255,0.3)"/>
