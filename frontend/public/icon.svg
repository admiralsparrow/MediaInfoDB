  <rect x="444" y="420" width="28" height="36" rx="6" fill="rgba(255,255,255,0.3)"/>
  <!-- Center circle -->
  <circle cx="256" cy="256" r="140" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.6)" stroke-width="8"/>
  <!-- Info "i" symbol -->
  <circle cx="256" cy="190" r="22" fill="white"/>
